---
# Azure IPI prerequisites live in the provider collection. It installs the
# pinned CLI and writes ~/.azure/osServicePrincipal.json with mode u=rw,go=
# using normalized localhost credentials. See that role's README and defaults/main.yml for
# inputs.
# This does not invoke the ARO destruction API; ARO uses host_ocp4_aro_destroy.

- name: Prepare Azure installer credentials
  ansible.builtin.include_role:
    name: agnosticd.cloud_provider_azure.installer_credentials
