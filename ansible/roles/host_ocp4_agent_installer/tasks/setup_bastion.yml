---
- name: Set up bastion access to the installed cluster
  delegate_to: "{{ groups['bastions'][0] }}"
  become: true
  block:
  - name: Ensure user kube directories exist
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: directory
      owner: "{{ item.owner }}"
      group: "{{ item.group }}"
      mode: "0700"
    loop:
    - path: "/home/{{ ansible_user }}/.kube"
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
    - path: /root/.kube
      owner: root
      group: root

  - name: Copy kubeconfig for bastion users
    ansible.builtin.copy:
      remote_src: true
      src: "{{ _agent_install_dir }}/auth/kubeconfig"
      dest: "{{ item.path }}"
      owner: "{{ item.owner }}"
      group: "{{ item.group }}"
      mode: "0600"
    loop:
    - path: "/home/{{ ansible_user }}/.kube/config"
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
    - path: /root/.kube/config
      owner: root
      group: root

  - name: Set up student kubeconfig
    when: bastion_setup_student_user | default(false) | bool
    block:
    - name: Ensure student kube directory exists
      ansible.builtin.file:
        path: "/home/{{ bastion_student_user_name }}/.kube"
        state: directory
        owner: "{{ bastion_student_user_name }}"
        group: users
        mode: "0700"

    - name: Copy student kubeconfig
      ansible.builtin.copy:
        remote_src: true
        src: "{{ _agent_install_dir }}/auth/kubeconfig"
        dest: "/home/{{ bastion_student_user_name }}/.kube/config"
        owner: "{{ bastion_student_user_name }}"
        group: users
        mode: "0600"

  - name: Create OpenShift Bash completion file
    ansible.builtin.shell: oc completion bash >/etc/bash_completion.d/openshift
    changed_when: true
