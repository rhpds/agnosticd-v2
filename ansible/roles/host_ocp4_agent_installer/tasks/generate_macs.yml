---
- name: Generate control plane MAC addresses
  ansible.builtin.set_fact:
    ai_control_plane_macs: >-
      {{ ai_control_plane_macs + ['f6' | community.general.random_mac(ai_ocp_namespace + _cluster_name + 'm1' + _index | string)] }}
    ai_control_plane_macs2: >-
      {{ ai_control_plane_macs2 + ['f6' | community.general.random_mac(ai_ocp_namespace + _cluster_name + 'm2' + _index | string)] }}
  loop: "{{ range(1, control_plane_instance_count | int + 1) | list }}"
  loop_control:
    loop_var: _index

- name: Generate control plane MAC addresses for attached networks
  ansible.builtin.set_fact:
    ai_attach_control_plane_macs: >-
      {{
        ai_attach_control_plane_macs | combine({
          item.1: (ai_attach_control_plane_macs[item.1] | default([])) + [
            'f6' | community.general.random_mac(ai_ocp_namespace + _cluster_name + item.0 | string + item.1)
          ]
        })
      }}
  loop: "{{ range(1, control_plane_instance_count | int + 1) | list | product(ai_attach_control_plane_networks) | list }}"

- name: Generate worker MAC addresses
  ansible.builtin.set_fact:
    ai_workers_macs: >-
      {{ ai_workers_macs + ['f6' | community.general.random_mac(ai_ocp_namespace + _cluster_name + 'w1' + _index | string)] }}
    ai_workers_macs2: >-
      {{ ai_workers_macs2 + ['f6' | community.general.random_mac(ai_ocp_namespace + _cluster_name + 'w2' + _index | string)] }}
  loop: "{{ range(1, worker_instance_count | int + 1) | list }}"
  loop_control:
    loop_var: _index

- name: Generate worker MAC addresses for attached networks
  ansible.builtin.set_fact:
    ai_attach_workers_macs: >-
      {{
        ai_attach_workers_macs | combine({
          item.1: (ai_attach_workers_macs[item.1] | default([])) + [
            'f6' | community.general.random_mac(ai_ocp_namespace + _cluster_name + item.0 | string + item.1)
          ]
        })
      }}
  loop: "{{ range(1, worker_instance_count | int + 1) | list | product(ai_attach_workers_networks) | list }}"
