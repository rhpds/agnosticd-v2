---
- name: Generate mac addresses for control plane
  ansible.builtin.set_fact:
    ai_control_plane_macs: >
      {{ ai_control_plane_macs + ['f6' |
          community.general.random_mac(ai_ocp_namespace + _cluster_name + 'm1' + _index|string)] }}
    ai_control_plane_macs2: >
      {{ ai_control_plane_macs2 + ['f6' |
          community.general.random_mac(ai_ocp_namespace + _cluster_name + 'm2' + _index|string)] }}
  loop: "{{ range(1,control_plane_instance_count|int+1)|list }}"
  loop_control:
    loop_var: _index

- name: Generate MAC addresses for control plane for attached networks
  ansible.builtin.set_fact:
    ai_attach_control_plane_macs: >-
      {{
        ai_attach_control_plane_macs | combine({
          item.1: (ai_attach_control_plane_macs[item.1] | default([])) + [
            'f6' | community.general.random_mac(
              ai_ocp_namespace + _cluster_name + item.0|string + item.1
            )
          ]
        })
      }}
  loop: "{{ range(1, control_plane_instance_count | int + 1) | list | product(ai_attach_control_plane_networks) | list }}"
  loop_control:
    loop_var: item

- name: Generate mac addresses for workers
  ansible.builtin.set_fact:
    ai_workers_macs: >
        {{ ai_workers_macs + ['f6' |
            community.general.random_mac(ai_ocp_namespace + _cluster_name + 'w1' + _index|string)] }}
    ai_workers_macs2: >
        {{ ai_workers_macs2 + ['f6' |
            community.general.random_mac(ai_ocp_namespace + _cluster_name + 'w2' + _index|string)] }}
  loop: "{{ range(1,worker_instance_count|int+1)|list }}"
  loop_control:
    loop_var: _index

- name: Generate MAC addresses for workers for attached networks
  ansible.builtin.set_fact:
    ai_attach_workers_macs: >-
      {{
        ai_attach_workers_macs | combine({
          item.1: (ai_attach_workers_macs[item.1] | default([])) + [
            'f6' | community.general.random_mac(
              ai_ocp_namespace + _cluster_name + item.0|string + item.1
            )
          ]
        })
      }}
  loop: "{{ range(1, worker_instance_count | int + 1) | list | product(ai_attach_workers_networks) | list }}"
  loop_control:
    loop_var: item

- name: Set static_network_config variable
  ansible.builtin.set_fact:
    static_network_config: "{{ lookup('template','static_network_config_full.yaml.j2') | from_yaml }}"

- name: Create Infrastructure environment
  rhpds.assisted_installer.create_infra_env:
    name: "{{ _cluster_name }}-infra-env"
    image_type: "{{ ai_cluster_iso_type }}"
    cluster_id: "{{ newcluster.result.id }}"
    openshift_version: "{{ ai_cluster_version }}"
    ssh_authorized_key: "{{ ai_ssh_authorized_key }}"
    offline_token: "{{ ai_offline_token }}"
    pull_secret: "{{ ai_pull_secret }}"
    static_network_config: "{{ static_network_config }}"
  register: newinfraenv

- name: Delete existing installation ISO DataVolume if it exists
  kubernetes.core.k8s:
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    name: installation-iso
    namespace: "{{ ai_ocp_namespace }}"
    state: absent
    wait: true
    wait_timeout: 120

- name: Create DataVolume for the installation ISO
  vars:
    image_url: "{{ newinfraenv.result.download_url }}"
  kubernetes.core.k8s:
    template: installation_iso.yaml.j2
    wait: true
    wait_timeout: 300

- name: Wait for installation ISO DataVolume to be ready
  kubernetes.core.k8s_info:
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    name: "installation-iso-{{ _cluster_name }}"
    namespace: "{{ ai_ocp_namespace }}"
  register: r_installation_iso_dv
  until:
  - r_installation_iso_dv.resources | length > 0
  - r_installation_iso_dv.resources[0].status.phase is defined
  - r_installation_iso_dv.resources[0].status.phase == "Succeeded"
  retries: 60
  delay: 10
  failed_when:
  - r_installation_iso_dv.resources | length > 0
  - r_installation_iso_dv.resources[0].status.phase is defined
  - r_installation_iso_dv.resources[0].status.phase == "Failed"

- name: Create three control plane VMs for full cluster
  vars:
    vmname: "{{ ai_ocp_vmname_control_plane_prefix }}-{{ _index }}"
    network: "{{ cluster_name }}-openshift"
    network_name: "{{ ai_install_use_network | default(cluster_name + '-openshift') }}"
    pod_network: "192.168.{{ _index }}.0/24"
  ansible.builtin.include_tasks: kubevirt/create_control_plane_etcd.yaml
  loop: "{{ range(1,control_plane_instance_count | int+1) | list }}"
  loop_control:
    loop_var: _index

- name: Create {{ worker_instance_count }} worker VMs for full cluster
  vars:
    vmname: "{{ ai_ocp_vmname_worker_prefix }}-{{ _index }}"
    network: "{{ cluster_name}}-openshift"
    network_name: "{{ ai_install_use_network | default(cluster_name + '-openshift') }}"
    pod_network: "192.168.1{{ _index }}.0/24"
  ansible.builtin.include_tasks: kubevirt/create_workers.yaml
  loop: "{{ range(1,worker_instance_count | int+1) | list }}"
  loop_control:
    loop_var: _index

- name: Wait for three control plane VMs to be running
  vars:
    vmname: "{{ ai_ocp_vmname_control_plane_prefix }}-{{ _index }}"
  ansible.builtin.include_tasks: kubevirt/wait_control_plane_etcd.yaml
  loop: "{{ range(1,control_plane_instance_count | int+1) | list }}"
  loop_control:
    loop_var: _index

- name: Wait for {{ worker_instance_count }} worker VMs to be running
  vars:
    vmname: "{{ ai_ocp_vmname_worker_prefix }}-{{ _index }}"
  ansible.builtin.include_tasks: kubevirt/wait_workers.yaml
  loop: "{{ range(1,worker_instance_count | int+1) | list }}"
  loop_control:
    loop_var: _index

# Don't change role - AI collection won't find the node if the role is not 'master'
- name: Set the variable ai_configure_hosts for control-plane
  ansible.builtin.set_fact:
    ai_configure_hosts: >-
      {{ ai_configure_hosts + [
        {'hostname': ai_ocp_vmname_control_plane_prefix + "-" + _index|string,
      'role': 'master',
      'installation_disk': '/dev/vda'}] }}
  loop: "{{ range(1,control_plane_instance_count | int+1) | list }}"
  loop_control:
    loop_var: _index

- name: Set the variable ai_configure_hosts for workers
  ansible.builtin.set_fact:
    ai_configure_hosts: >-
      {{ ai_configure_hosts + [
      {'hostname': ai_ocp_vmname_worker_prefix + "-" + _index|string,
      'role': 'worker',
      'installation_disk': '/dev/vda'}] }}
  loop: "{{ range(1,worker_instance_count | int+1) | list }}"
  loop_control:
    loop_var: _index

- name: Wait for the hosts to be ready
  rhpds.assisted_installer.wait_for_hosts:
    cluster_id: "{{ newcluster.result.id }}"
    offline_token: "{{ ai_offline_token }}"
    expected_hosts: "{{ control_plane_instance_count | int + worker_instance_count | int }}"
    infra_env_id: "{{ newinfraenv.result.id }}"
    configure_hosts: "{{ ai_configure_hosts }}"
    wait_timeout: 600
  register: r_wait_for_hosts
  until: r_wait_for_hosts is succeeded
  retries: 3
  delay: 20

# Verify every host has a live IP on the cluster network before triggering installation.
# The static_network_config in the InfraEnv ISO only covers the discovery (boot-from-ISO)
# phase. The AI service is responsible for writing the NMState config to each node's
# root disk during installation. If that write fails silently for any node, the installed
# OS will have no IP on enp2s0 and ignition will loop indefinitely trying to reach the
# MCS — this check catches the failure in seconds rather than after a 90-minute timeout.
- name: Exchange offline token for AI API access token
  ansible.builtin.uri:
    url: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: refresh_token
      client_id: cloud-services
      refresh_token: "{{ ai_offline_token }}"
    status_code: 200
  register: r_ai_access_token
  no_log: true

- name: Fetch cluster hosts from Assisted Installer API
  ansible.builtin.uri:
    url: "https://api.openshift.com/api/assisted-install/v2/clusters/{{ newcluster.result.id }}/hosts"
    method: GET
    headers:
      Authorization: "Bearer {{ r_ai_access_token.json.access_token }}"
    status_code: 200
  register: r_ai_hosts
  no_log: true

- name: Verify each host has a static IP on the cluster network before starting installation
  vars:
    _inventory: "{{ (item.inventory if item.inventory else '{}') | from_json }}"
    _all_ips: >-
      {{ _inventory.interfaces | default([])
         | map(attribute='ipv4_addresses', default=[])
         | flatten
         | map('regex_replace', '/[0-9]+$', '')
         | select
         | list }}
    _on_cluster_net: >-
      {{ _all_ips
         | ansible.utils.ipaddr(ai_network_prefix + '.0/' + ai_network_prefix_length | string)
         | list }}
  ansible.builtin.assert:
    that: _on_cluster_net | length > 0
    fail_msg: >-
      Host '{{ item.requested_hostname | default(item.id) }}' has no IP on the cluster
      network {{ ai_network_prefix }}.0/{{ ai_network_prefix_length }}.
      Found IPs: {{ _all_ips }}.
      The InfraEnv static network configuration did not apply to this host.
      Check that MAC addresses in the static_network_config match the VM interfaces.
  loop: "{{ r_ai_hosts.json }}"
  loop_control:
    label: "{{ item.requested_hostname | default(item.id) }}"
