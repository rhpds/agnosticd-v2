---
# Azure IPI credentials and CLI installation are owned by the provider
# collection.
# Initialize the provider on localhost first and run this include on the
# bastion.
# See installer_credentials/README.md and defaults/main.yml in that collection;
# ARO's isolated temporary CLI session is handled by host_ocp4_aro_install
# instead.

- name: Prepare Azure installer credentials
  ansible.builtin.include_role:
    name: agnosticd.cloud_provider_azure.installer_credentials
