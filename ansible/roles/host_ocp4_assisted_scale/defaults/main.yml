---
cluster_name: "cluster-{{ guid.split('-')[0] if '-' in guid else guid }}"
_cluster_name: "{{ cluster_name }}"
ocp4_pull_secret: "{{ ocp4_ai_pull_secret }}"

ai_pull_secret: "{{ ocp4_pull_secret | to_json | to_json if ocp4_pull_secret is mapping else ocp4_pull_secret | to_json }}"
ai_offline_token: "{{ ocp4_ai_offline_token }}"
ai_cluster_name: "{{ guid }}"
ai_ocp_namespace: "{{ sandbox_openshift_namespace | default(env_type + '-' + guid) }}"
ai_cluster_iso_type: minimal-iso
ai_network_prefix: "10.10.10"
ai_workers_macs: []
ai_workers_macs2: []
ai_attach_workers_macs: {}
ai_ocp_vmname_worker_prefix: "worker-{{ cluster_name }}"
ai_storage_class: ocs-storagecluster-ceph-rbd

# This variable is used to configure the role and the installation disk
ai_configure_hosts: []

# When true, remove worker role from control-plane nodes and mark masters non-schedulable
worker_only: false

# CSR approval retry settings
approve_csr_retries: 90
approve_csr_delay: 10

# Wait for scale-iso DataVolume import before creating worker VMs.
# Same class of bug as host_ocp4_assisted_installer #207/#208: k8s wait on
# apply only confirms the DV object exists, not that CDI finished importing.
ai_scale_iso_dv_retries: 60
ai_scale_iso_dv_delay: 10

# Wait for worker VirtualMachines to reach printableStatus=Running.
# 30x10s (5m) is too short for CNV assisted-scale boots; LB1088 event
# job 99115 saw worker-1 stuck Provisioning/VMINotExists and worker-2
# Starting/GuestNotRunning before timeout.
ai_scale_worker_vm_retries: 90
ai_scale_worker_vm_delay: 10
