---
# Find and delete ALL Assisted Installer clusters that match this name -
# not just the first/last match. Two records per name is normal even
# without duplicates: day-2 "adding-hosts" records share the main
# cluster's name (with an empty base_dns_domain). The old loop +
# set_fact implementation overwrote cluster_id on each matching
# iteration, so only the last match was ever deleted - most likely the
# day-2 record, leaving the main "installed" cluster orphaned (and
# explaining the ~2,000 installed registrations currently in the shared
# AI account). selectattr/map below collects every matching ID.
- name: "List existing Assisted Installer clusters (looking for {{ _dedup_cluster_name }})"
  # owner: true was removed here after live testing (26 Oct 2026) showed it
  # is non-functional against the real API: owner=true/false/1 all return
  # HTTP 200 with a literal [] body, so it never returned any clusters at
  # all - not a casing issue (rhpds/assisted_installer#8's owner type='bool'
  # + lowercase fix is correct and necessary, but doesn't help here), there
  # is simply no value of this param that returns real data. With owner:
  # true, this task's list was always empty, so destroy never found (and
  # never deleted) the cluster it was supposed to clean up - confirmed via
  # a real job (cluster-qp6xf stayed registered with deleted_at: null after
  # a "Successful" destroy run). Correctness now relies entirely on the
  # exact-name match below against the full account list, same as
  # effectively happened before rhpds/assisted_installer#8 (when params
  # weren't forwarded at all).
  rhpds.assisted_installer.list_clusters:
    offline_token: "{{ ai_offline_token }}"
  register: _r_dedup_existing_clusters

- name: "Determine matching cluster(s) named {{ _dedup_cluster_name }}"
  ansible.builtin.set_fact:
    _dedup_existing_clusters: >-
      {{ _r_dedup_existing_clusters.result
         | selectattr('name', 'equalto', _dedup_cluster_name)
         | list }}

# Extra SNO clusters are registered under a bare name (e.g. "dr") shared by
# every environment's extra SNO of that name - only base_dns_domain carries
# the guid. Without this, the match above would also catch (and delete)
# every other live deployment's same-named extra SNO cluster. Call sites for
# extra SNO clusters pass _dedup_base_dns_domain; the main cluster (and its
# day-2 adding-hosts records, which have an empty base_dns_domain) does not,
# so this step is a no-op there.
- name: "Further scope by base_dns_domain (extra-SNO cross-env collision guard)"
  when: _dedup_base_dns_domain is defined
  ansible.builtin.set_fact:
    _dedup_existing_clusters: >-
      {{ _dedup_existing_clusters
         | selectattr('base_dns_domain', 'equalto', _dedup_base_dns_domain)
         | list }}

- name: "Determine IDs of all cluster(s) named {{ _dedup_cluster_name }}"
  ansible.builtin.set_fact:
    _dedup_existing_cluster_ids: "{{ _dedup_existing_clusters | map(attribute='id') | list }}"

- name: "Debug: cluster(s) to be removed for {{ _dedup_cluster_name }}"
  when: _dedup_existing_cluster_ids | length > 0
  ansible.builtin.debug:
    msg: "Deleting cluster(s) named {{ _dedup_cluster_name }}: IDs={{ _dedup_existing_cluster_ids }}"

- name: "Delete all cluster(s) named {{ _dedup_cluster_name }}"
  when: _dedup_existing_cluster_ids | length > 0
  rhpds.assisted_installer.delete_cluster:
    cluster_id: "{{ item }}"
    offline_token: "{{ ai_offline_token }}"
  loop: "{{ _dedup_existing_cluster_ids }}"
  loop_control:
    label: "{{ item }}"
  register: _r_dedup_delete_result
  ignore_errors: true

- name: "Fail: unable to delete cluster(s) named {{ _dedup_cluster_name }}"
  when: _r_dedup_delete_result is failed
  ansible.builtin.fail:
    msg: >-
      Failed to delete one or more clusters named {{ _dedup_cluster_name }}:
      {{ _r_dedup_delete_result.results
      | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list }}
