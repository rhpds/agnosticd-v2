---
# Test-only scale-up after an Agent-based SNO or three-master installation.
# This role does not call the hosted Assisted Installer service.
ai_ocp_namespace: "{{ sandbox_openshift_namespace | default(config + '-' + guid) }}"
ai_network_prefix: "10.10.10"
ai_network_prefix_length: 24
ai_workers_macs: []
ai_workers_macs2: []
ai_network_mtu: 1500
ai_ocp_vmname_worker_prefix: "worker-{{ cluster_name }}"
ai_storage_class: ocs-storagecluster-ceph-rbd
ai_workers_cores: 16
ai_workers_memory: 64Gi
ai_workers_root_disk_size: 100Gi
ai_workers_extra_disks: []
ai_attach_workers_networks: []
agent_scale_iso_size: 4Gi
agent_scale_timeout: 2700
agent_scale_iso_timeout: 1200
agent_scale_worker_count: 0
