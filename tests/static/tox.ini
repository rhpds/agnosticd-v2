[tox]
minversion=2.3.1
envlist =
    #py{27,35}-{flake8,pylint,unit}
    #py27-{yamllint,ansible_syntax,generate_validation}
    py312-ansible_syntax
    ansible_lint_gcp
  aro_dispatch
    # py312-ansible_syntax
skipsdist=True
skip_missing_interpreters=True

[testenv]
skip_install=True
setenv = TOX_ANSIBLE_INV_PATH = {toxinidir}/tox-inventory.txt
allowlist_externals = */agnosticd-v2/tests/static/syntax-check.sh
deps =
    -r{toxinidir}/test-requirements.txt

commands =
    ansible_syntax: {toxinidir}/syntax-check.sh {posargs}

[testenv:ansible_lint_gcp]
# Scoped to the GCP cloud provider paths only; the rest of the repo
# is not yet ansible-lint clean and is out of scope here.
changedir = {toxinidir}/../..
commands =
    ansible-lint \
      ansible/cloud_providers/gcp/ \
      ansible/configs/openshift-cluster/gcp/ \
      ansible/configs/openshift-cluster/sample_vars/openshift-cluster-gcp.yml

[testenv:aro_dispatch]
# Exercise the real ARO dispatcher with a local stub; no Azure access is used.
changedir = {toxinidir}/../..
commands = python tests/integration/test_aro_dispatch.py -v
